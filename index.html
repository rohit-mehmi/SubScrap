<!DOCTYPE html>
<html lang="en" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubScrap - Reddit Explorer</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandOrange: '#FF5722',
                    }
                }
            }
        }
    </script>
    <style>
        .glass-dock {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between items-center text-white p-6 overflow-hidden relative font-sans">

    <!-- TOP: Main Logo & Greeting -->
    <header class="flex flex-col items-center mt-6 z-10 space-y-3">
        <img src="logo.png" alt="SubScrap Logo" class="w-40 md:w-56 object-contain drop-shadow-[0_10px_20px_rgba(255,87,34,0.3)]" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x80/000000/FFFFFF?text=SubScrap';">
        <p id="greeting-text" class="text-sm md:text-base text-gray-300 font-medium tracking-wide">
            "Hey boss, or is this someone else? Respected Madam! Type anything you wish to explore on Reddit..." 👑 🍲
        </p>
    </header>

    <!-- MIDDLE: Completely Empty Space as Requested -->
    <main class="flex-grow"></main>

    <!-- CENTER-BOTTOM: Fluffy Glassmorphic Search Dock with Side Buttons -->
    <footer class="w-full max-w-3xl mb-8 z-10">
        <div class="flex items-center justify-center gap-3 w-full">
            
            <!-- Left Button: Saved (Small, Round, Fluffy) -->
            <button onclick="openSaved()" class="glass-dock hover:bg-white/10 text-gray-200 text-xs md:text-sm font-medium px-4 py-3 rounded-full transition-all duration-300 flex items-center gap-1.5 shadow-lg whitespace-nowrap active:scale-95">
                <span>⭐</span> Saved
            </button>

            <!-- Center: Fluffy Round Search Bar -->
            <div class="glass-dock flex-grow rounded-full px-5 py-3 flex items-center shadow-2xl transition-all duration-300 focus-within:border-brandOrange focus-within:ring-2 focus-within:ring-brandOrange/50">
                <input 
                    id="search-input" 
                    type="text" 
                    placeholder="Search anything on Reddit (e.g. handmade sketches in India)..." 
                    class="w-full bg-transparent text-white placeholder-gray-400 text-sm md:text-base focus:outline-none"
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="executeSearch()" class="ml-2 bg-gradient-to-r from-orange-500 to-brandOrange hover:from-orange-600 hover:to-orange-700 text-white p-2.5 rounded-full transition-all shadow-md active:scale-95 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
            </div>

            <!-- Right Button: Get Help from Boss (Small, Round, Fluffy) -->
            <button onclick="openBossHelp()" class="glass-dock hover:bg-white/10 text-gray-200 text-xs md:text-sm font-medium px-4 py-3 rounded-full transition-all duration-300 flex items-center gap-1.5 shadow-lg whitespace-nowrap active:scale-95">
                <span>🍲</span> Help from Boss
            </button>

        </div>
    </footer>

    <!-- Simple Script Handlers -->
    <script>
        function executeSearch() {
            const query = document.getElementById('search-input').value.trim();
            if(!query) return;
            alert("Respected Madam, searching Reddit for: '" + query + "'. Please be cool, Boss gonna kill me if they find this out! 🍲✨");
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                executeSearch();
            }
        }

        function openSaved() {
            alert("Respected Madam, checking your saved items safely under Boss's supervision! ⭐");
        }

        function openBossHelp() {
            alert("Please be cool! Boss is watching over this pressure cooker 🍲. What assistance do you need?");
        }
    </script>
</body>
</html>
