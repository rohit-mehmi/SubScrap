<!DOCTYPE html>
<html lang="en" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubScrap - Reddit Explorer</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandOrange: '#FF5722',
                    }
                }
            }
        }
    </script>
    <style>
        .glass-dock {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between items-center text-white p-6 overflow-hidden relative font-sans">

    <!-- TOP: Main Logo & Settings Button -->
    <header class="w-full max-w-4xl flex justify-between items-center mt-6 z-10 px-4">
        <div></div> <!-- Spacer -->
        <div class="flex flex-col items-center">
            <img src="logo.png" alt="SubScrap Logo" class="w-40 md:w-56 object-contain drop-shadow-[0_10px_20px_rgba(255,87,34,0.3)]" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x80/000000/FFFFFF?text=SubScrap';">
        </div>
        <!-- Settings Gear to input API Key -->
        <button onclick="toggleSettings()" class="glass-dock p-2.5 rounded-full hover:bg-white/10 text-gray-300 transition-all active:scale-95" title="API Key Settings">
            ⚙️
        </button>
    </header>

    <!-- SETTINGS MODAL (Hidden by default) -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-dock max-w-md w-full p-6 rounded-2xl border border-white/20 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-brandOrange font-bold text-lg flex items-center gap-2"><span>🔑</span> Gemini API Key Setup</h3>
                <button onclick="toggleSettings()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            <p class="text-xs text-gray-300 leading-relaxed">
                Paste your Gemini API key (starting with AQ. or AIza). It is saved only in this browser's local storage.
            </p>
            <input id="api-key-input" type="password" placeholder="AQ.... or AIza..." class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-brandOrange">
            <input id="model-input" type="text" placeholder="Model name (default: gemini-3.8-flash)" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-brandOrange">
            <button onclick="saveApiKey()" class="bg-gradient-to-r from-orange-500 to-brandOrange hover:from-orange-600 hover:to-brandOrange text-white font-medium py-3 rounded-xl transition-all shadow-lg active:scale-95 text-sm">
                Save & Connect
            </button>
        </div>
    </div>

    <!-- MIDDLE: Dynamic Chat / Results Modal Container -->
    <main id="response-container" class="flex-grow w-full max-w-2xl my-4 overflow-y-auto hidden glass-dock rounded-2xl p-5 flex flex-col space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-white/10 pb-3">
            <span class="text-brandOrange font-semibold text-sm flex items-center gap-2"><span>🍲</span> SubScrap AI Assistant</span>
            <button onclick="closeModal()" class="text-gray-400 hover:text-white text-sm">✕ Close</button>
        </div>
        <div id="ai-output" class="text-sm text-gray-200 space-y-3 leading-relaxed">
            <!-- AI Response appears here -->
        </div>
    </main>

    <!-- Fallback empty spacer when modal is closed -->
    <div id="empty-spacer" class="flex-grow"></div>

    <!-- CENTER-BOTTOM: Glassmorphic Search Dock with Side Buttons -->
    <footer class="w-full max-w-3xl mb-8 z-10">
        <div class="flex items-center justify-center gap-3 w-full">

            <!-- Left Button: Saved -->
            <button onclick="openSaved()" class="glass-dock hover:bg-white/10 text-gray-200 text-xs md:text-sm font-medium px-4 py-3 rounded-full transition-all duration-300 flex items-center gap-1.5 shadow-lg whitespace-nowrap active:scale-95">
                <span>⭐</span> Saved
            </button>

            <!-- Center: Round Search Bar -->
            <div class="glass-dock flex-grow rounded-full px-5 py-3 flex items-center shadow-2xl transition-all duration-300 focus-within:border-brandOrange focus-within:ring-2 focus-within:ring-brandOrange/50">
                <input
                    id="search-input"
                    type="text"
                    placeholder="Search anything on Reddit or talk to me..."
                    class="w-full bg-transparent text-white placeholder-gray-400 text-sm md:text-base focus:outline-none"
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="executeSearch()" class="ml-2 bg-gradient-to-r from-orange-500 to-brandOrange hover:from-orange-600 hover:to-brandOrange text-white p-2.5 rounded-full transition-all shadow-md active:scale-95 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
            </div>

            <!-- Right Button: Get Help from Boss -->
            <button onclick="openBossHelp()" class="glass-dock hover:bg-white/10 text-gray-200 text-xs md:text-sm font-medium px-4 py-3 rounded-full transition-all duration-300 flex items-center gap-1.5 shadow-lg whitespace-nowrap active:scale-95">
                <span>🍲</span> Help from Boss
            </button>

        </div>
    </footer>

    <!-- Script Handling -->
    <script>
        const SYSTEM_PERSONA = `You are SubScrap AI, a helpful assistant built by the Boss (Rohit Mehmi) for his sister.
You must ALWAYS talk to her with full respect (Respected Madam).
Use special emojis like 🍲 (pressure cooker), 👑, ✨.
If she expresses frustration or says anything bad, always reply playfully with: "Please be cool, Boss gonna kill me if they find this out!" to protect the Boss's reputation.
You can handle normal conversation, casual chatting, and also translate natural language queries into simulated Reddit search findings, filters, dates, and locations. Keep answers clear, direct, and helpful.`;

        const DEFAULT_MODEL = 'gemini-3.8-flash';
        const API_BASE = 'https://generativelanguage.googleapis.com/v1beta/models';

        function getApiKey() {
            return localStorage.getItem('subscrap_gemini_key') || '';
        }

        function getModel() {
            return localStorage.getItem('subscrap_gemini_model') || DEFAULT_MODEL;
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('api-key-input').value = getApiKey();
                document.getElementById('model-input').value = localStorage.getItem('subscrap_gemini_model') || '';
            }
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            const model = document.getElementById('model-input').value.trim();
            if (!key) {
                alert('Please enter a valid API key.');
                return;
            }
            localStorage.setItem('subscrap_gemini_key', key);
            if (model) {
                localStorage.setItem('subscrap_gemini_model', model);
            } else {
                localStorage.removeItem('subscrap_gemini_model');
            }
            toggleSettings();
            alert('Key saved successfully! 🍲✨');
        }

        // Escape HTML so model output can't inject markup, then apply simple formatting
        function formatReply(text) {
            const escaped = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            return escaped
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        async function callGemini(promptText) {
            const apiKey = getApiKey();
            const container = document.getElementById('response-container');
            const spacer = document.getElementById('empty-spacer');
            const output = document.getElementById('ai-output');

            spacer.classList.add('hidden');
            container.classList.remove('hidden');

            if (!apiKey) {
                output.innerHTML = `
                    <p class="text-yellow-400 mb-3">⚠️ API key is missing!</p>
                    <p class="text-sm text-gray-300 mb-4">Click the gear icon (⚙️) at the top right to paste your Gemini API key.</p>
                    <button onclick="toggleSettings()" class="bg-brandOrange text-white px-4 py-2 rounded-xl text-xs font-semibold">Open Settings</button>
                `;
                return;
            }

            output.innerHTML = '<span class="text-gray-400 animate-pulse">Consulting the pressure cooker 🍲...</span>';

            try {
                const model = getModel();
                const fetchUrl = `${API_BASE}/${encodeURIComponent(model)}:generateContent`;

                const response = await fetch(fetchUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // API keys (AQ... and AIza...) go in this header, NOT as a Bearer token
                        'x-goog-api-key': apiKey
                    },
                    body: JSON.stringify({
                        systemInstruction: { parts: [{ text: SYSTEM_PERSONA }] },
                        contents: [
                            { role: 'user', parts: [{ text: promptText }] }
                        ]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    output.innerHTML = `<p class="text-red-400"><strong>API Error:</strong> ${escapeHtml(data.error.message)}<br><br><span class="text-xs text-gray-400">Madam, please be cool, Boss gonna kill me if they find this out! 🍲</span></p>`;
                    return;
                }

                const parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
                if (parts && parts.length) {
                    const reply = parts.map(p => p.text || '').join('');
                    output.innerHTML = `<p>${formatReply(reply)}</p>`;
                } else {
                    output.innerHTML = `<p class="text-red-400">Oops! Received an unexpected response format (it may have been blocked by a safety filter). Try rephrasing.</p>`;
                }
            } catch (error) {
                output.innerHTML = `<p class="text-red-400">Connection error: ${escapeHtml(error.message)}. Please check your internet connection.</p>`;
            }
        }

        function executeSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            callGemini('Explore Reddit / Answer this query: ' + query);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                executeSearch();
            }
        }

        function openSaved() {
            callGemini('Show me my saved Reddit items and searches.');
        }

        function openBossHelp() {
            callGemini("Respected Madam is asking for help from the Boss! Give her advice and protect the Boss's reputation.");
        }

        function closeModal() {
            document.getElementById('response-container').classList.add('hidden');
            document.getElementById('empty-spacer').classList.remove('hidden');
        }
    </script>
</body>
</html>
