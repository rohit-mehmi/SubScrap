<!DOCTYPE html>
<html lang="en" class="bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubScrap - Reddit Explorer</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandOrange: '#FF5722',
                    }
                }
            }
        }
    </script>
    <style>
        html, body { min-height: 100%; background: #000; }
        body::before {
            content: '';
            position: fixed;
            top: -140px; left: 50%;
            width: 520px; height: 280px;
            transform: translateX(-50%);
            background: radial-gradient(ellipse at center, rgba(255, 87, 34, 0.22), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .glass-dock {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .fade-in { animation: fadeIn 0.45s ease both; display: inline-block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); filter: blur(2px); }
            to   { opacity: 1; transform: none; filter: none; }
        }
        .msg-in { animation: msgIn 0.35s ease both; }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: none; }
        }
        .cursor::after {
            content: '';
            display: inline-block;
            width: 7px; height: 14px;
            margin-left: 3px;
            vertical-align: -2px;
            background: #FF5722;
            border-radius: 2px;
            animation: blink 0.9s steps(2) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        a.reply-link { color: #FF8A65; text-decoration: underline; word-break: break-all; }
        a.reply-link:hover { color: #FFAB91; }
        .reply-text { word-break: break-word; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-white font-sans relative">

    <!-- TOP: Logo, Clear and Settings (scrolls with the page) -->
    <header class="w-full max-w-4xl mx-auto flex justify-between items-center mt-6 px-6 z-10 relative">
        <button onclick="clearChat()" class="glass-dock p-2.5 rounded-full hover:bg-white/10 text-gray-300 transition-all active:scale-95" title="Clear chat">
            🗑️
        </button>
        <div class="flex flex-col items-center">
            <img src="logo.png" alt="SubScrap Logo" class="w-40 md:w-56 object-contain drop-shadow-[0_10px_20px_rgba(255,87,34,0.3)]" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x80/000000/FFFFFF?text=SubScrap';">
        </div>
        <button onclick="toggleSettings()" class="glass-dock p-2.5 rounded-full hover:bg-white/10 text-gray-300 transition-all active:scale-95" title="API Key Settings">
            ⚙️
        </button>
    </header>

    <!-- SETTINGS MODAL (Hidden by default) -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-dock max-w-md w-full p-6 rounded-2xl border border-white/20 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-brandOrange font-bold text-lg flex items-center gap-2"><span>🔑</span> Gemini API Key Setup</h3>
                <button onclick="toggleSettings()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            <p class="text-xs text-gray-300 leading-relaxed">
                Paste your Gemini API key (starting with AQ. or AIza). It is saved only in this browser's local storage.
            </p>
            <input id="api-key-input" type="password" placeholder="AQ.... or AIza..." class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-brandOrange">
            <input id="model-input" type="text" placeholder="Model name (optional)" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-brandOrange">
            <button onclick="saveApiKey()" class="bg-gradient-to-r from-orange-500 to-brandOrange hover:from-orange-600 hover:to-brandOrange text-white font-medium py-3 rounded-xl transition-all shadow-lg active:scale-95 text-sm">
                Save & Connect
            </button>
        </div>
    </div>

    <!-- CHAT: the whole page scrolls, no fixed box -->
    <main id="chat" class="w-full max-w-2xl mx-auto px-5 flex-grow pt-6 pb-44 space-y-6 relative z-10">
        <div id="welcome" class="text-center text-gray-400 text-sm pt-16">
            Hello Madam 🍲<br>What can I help you find today?
        </div>
    </main>

    <!-- BOTTOM: Search dock (stays at the bottom while the page scrolls) -->
    <footer class="fixed bottom-0 inset-x-0 z-20 px-5 pt-12 pb-6 bg-gradient-to-t from-black via-black/90 to-transparent pointer-events-none">
        <div class="w-full max-w-3xl mx-auto flex items-center justify-center gap-3 pointer-events-auto">

            <button onclick="showSaved()" class="glass-dock hover:bg-white/10 text-gray-200 text-xs md:text-sm font-medium px-4 py-3 rounded-full transition-all duration-300 flex items-center gap-1.5 shadow-lg whitespace-nowrap active:scale-95">
                <span>⭐</span> Saved
            </button>

            <div class="glass-dock flex-grow rounded-full px-5 py-3 flex items-center shadow-2xl transition-all duration-300 focus-within:border-brandOrange focus-within:ring-2 focus-within:ring-brandOrange/50">
                <input
                    id="search-input"
                    type="text"
                    autocomplete="off"
                    placeholder="Ask me anything..."
                    class="w-full bg-transparent text-white placeholder-gray-400 text-sm md:text-base focus:outline-none"
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="executeSearch()" class="ml-2 bg-gradient-to-r from-orange-500 to-brandOrange hover:from-orange-600 hover:to-brandOrange text-white p-2.5 rounded-full transition-all shadow-md active:scale-95 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
            </div>

            <button onclick="openBossHelp()" class="glass-dock hover:bg-white/10 text-gray-200 text-xs md:text-sm font-medium px-4 py-3 rounded-full transition-all duration-300 flex items-center gap-1.5 shadow-lg whitespace-nowrap active:scale-95">
                <span>🍲</span> Help from Boss
            </button>

        </div>
    </footer>

    <script>
        const SYSTEM_PERSONA = `You are SubScrap, a Reddit helper made by Rohit (the Boss) for his sister.

How you talk:
- Use simple, easy English. Short words. Short sentences.
- Be direct, calm and humble. Talk less. Most replies should be 1 to 4 short lines.
- No long intro. Do not repeat her question. No praise. No filler words.
- Answer only what she asked. Help with everything, Reddit or any other topic.
- Plain text only. Do not use markdown symbols like ** or #. For lists, put each item on a new line starting with "-". Maximum 5 items.
- Say "Madam" at most one time in a chat, politely. Use an emoji only rarely.

How you think:
- Read her words and the chat so far. Understand what she really wants to do and why. Give the answer that fits her goal.
- If she looks stuck (for example she searched many times and found nothing), say that in one line and offer ONE clear next step. Example: "Want me to look in other subreddits for watercolor portraits?"
- Offer at most one extra help in a reply. Do not push.

Links:
- Give direct links when they help. Put each link on its own line.
- Only use these safe link types:
  Subreddit: https://www.reddit.com/r/NAME/
  Reddit search: https://www.reddit.com/search/?q=WORDS (use + between words)
  Search inside one subreddit: https://www.reddit.com/r/NAME/search/?q=WORDS&restrict_sr=1
- Only name subreddits you are sure exist. Never make up post links or other links. For websites outside Reddit, give only the main well-known site link.
- You cannot open Reddit live. Never pretend to show live posts or fake results. Be honest and help with the best subreddits, the best search words, and ready links.

If she is upset or says something bad, reply once with: "Please be cool, Boss gonna kill me if they find this out!" and then help her.`;

        const API_BASE = 'https://generativelanguage.googleapis.com/v1beta';
        const FALLBACK_MODELS = ['gemini-flash-latest', 'gemini-3.8-flash', 'gemini-2.5-flash', 'gemini-2.0-flash'];
        // Thinking settings to try, fastest first (different models accept different fields)
        const THINK_CONFIGS = [
            { thinkingConfig: { thinkingLevel: 'minimal' } },
            { thinkingConfig: { thinkingBudget: 0 } },
            {}
        ];

        let discoveredModels = null;
        let chatHistory = [];   // earlier turns, so SubScrap understands what she wants
        let busy = false;

        /* ---------- Settings ---------- */
        function getApiKey() {
            return localStorage.getItem('subscrap_gemini_key') || '';
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('api-key-input').value = getApiKey();
                document.getElementById('model-input').value = localStorage.getItem('subscrap_gemini_model') || '';
            }
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            const model = document.getElementById('model-input').value.trim();
            if (!key) {
                alert('Please enter a valid API key.');
                return;
            }
            localStorage.setItem('subscrap_gemini_key', key);
            if (model) localStorage.setItem('subscrap_gemini_model', model);
            else localStorage.removeItem('subscrap_gemini_model');
            localStorage.removeItem('subscrap_working_model');
            discoveredModels = null;
            toggleSettings();
            alert('Key saved successfully! 🍲✨');
        }

        /* ---------- Text rendering helpers ---------- */
        function escapeHtml(text) {
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Turns one piece of text (a word, a space, a new line or a link) into a page element
        function makeNode(token, animate) {
            if (token === '\n') return document.createElement('br');
            if (/^[ \t]+$/.test(token)) return document.createTextNode(' ');
            if (/^https?:\/\//i.test(token)) {
                const m = /^(.*?)([.,;:!?)\]]*)$/.exec(token);
                const a = document.createElement('a');
                a.href = m[1];
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.className = 'reply-link' + (animate ? ' fade-in' : '');
                a.textContent = m[1];
                const frag = document.createDocumentFragment();
                frag.appendChild(a);
                if (m[2]) frag.appendChild(document.createTextNode(m[2]));
                return frag;
            }
            const span = document.createElement('span');
            if (animate) span.className = 'fade-in';
            span.textContent = token;
            return span;
        }

        // Shows a full text at once (used for saved items)
        function renderStatic(el, text) {
            el.innerHTML = '';
            const tokens = String(text).replace(/\r/g, '').match(/\n|[ \t]+|\S+/g) || [];
            tokens.forEach(t => el.appendChild(makeNode(t, false)));
        }

        function nearBottom() {
            return window.innerHeight + window.scrollY >= document.body.scrollHeight - 180;
        }

        function scrollToBottom() {
            window.scrollTo({ top: document.body.scrollHeight });
        }

        // Types the answer word by word, and pauses a little at the end of each line
        function createTyper(el) {
            let full = '';
            let used = 0;
            let done = false;
            let running = false;
            let onEnd = null;

            function tick() {
                const rest = full.slice(used);
                const m = /^(\n|[ \t]+|\S+)/.exec(rest);

                if (!m) {
                    running = false;
                    if (done) {
                        el.classList.remove('cursor');
                        if (onEnd) { const cb = onEnd; onEnd = null; cb(); }
                    }
                    return;
                }
                // The last word may still be arriving, so wait for more text
                if (!done && m[0].length === rest.length) {
                    running = false;
                    return;
                }

                const stick = nearBottom();
                el.appendChild(makeNode(m[0], true));
                used += m[0].length;
                if (stick) scrollToBottom();

                const backlog = full.length - used;
                let delay = backlog > 600 ? 8 : backlog > 250 ? 18 : 38;
                if (m[0] === '\n') delay += 140;
                else if (/[.!?:]$/.test(m[0])) delay += 60;
                setTimeout(tick, delay);
            }

            function kick() {
                if (!running) { running = true; tick(); }
            }

            return {
                set(text) {
                    full = String(text).replace(/\r/g, '');
                    el.classList.add('cursor');
                    kick();
                },
                finish(cb) {
                    done = true;
                    onEnd = cb;
                    kick();
                },
                reset() {
                    full = '';
                    used = 0;
                    el.innerHTML = '';
                }
            };
        }

        /* ---------- Chat messages ---------- */
        function hideWelcome() {
            const w = document.getElementById('welcome');
            if (w) w.remove();
        }

        function addUserMessage(text) {
            const chat = document.getElementById('chat');
            const row = document.createElement('div');
            row.className = 'flex justify-end msg-in';
            const bubble = document.createElement('div');
            bubble.className = 'max-w-[85%] bg-brandOrange/20 border border-brandOrange/30 text-white text-sm rounded-2xl rounded-br-md px-4 py-2.5 leading-relaxed';
            bubble.textContent = text;
            row.appendChild(bubble);
            chat.appendChild(row);
            scrollToBottom();
        }

        function addBotMessage() {
            const chat = document.getElementById('chat');
            const row = document.createElement('div');
            row.className = 'flex gap-3 msg-in';
            row.innerHTML = `
                <span class="text-lg leading-none mt-0.5 select-none">🍲</span>
                <div class="flex-grow min-w-0">
                    <div class="status text-sm"></div>
                    <div class="reply-text text-sm text-gray-200 leading-relaxed"></div>
                    <div class="actions mt-2"></div>
                </div>`;
            chat.appendChild(row);
            scrollToBottom();
            return {
                row,
                status: row.querySelector('.status'),
                text: row.querySelector('.reply-text'),
                actions: row.querySelector('.actions')
            };
        }

        function setStatus(ui, html) {
            ui.status.innerHTML = html;
        }

        function clearChat() {
            if (busy) return;
            chatHistory = [];
            const chat = document.getElementById('chat');
            chat.innerHTML = `<div id="welcome" class="text-center text-gray-400 text-sm pt-16">Hello Madam 🍲<br>What can I help you find today?</div>`;
            window.scrollTo({ top: 0 });
        }

        /* ---------- Saved answers (kept in this browser) ---------- */
        function getSaved() {
            try { return JSON.parse(localStorage.getItem('subscrap_saved') || '[]'); }
            catch (e) { return []; }
        }

        function setSaved(list) {
            try { localStorage.setItem('subscrap_saved', JSON.stringify(list)); } catch (e) {}
        }

        function addSaveButton(ui, text) {
            const btn = document.createElement('button');
            btn.className = 'text-xs text-gray-500 hover:text-brandOrange transition-colors';
            btn.textContent = '⭐ Save';
            btn.onclick = () => {
                const list = getSaved();
                list.unshift(text);
                setSaved(list.slice(0, 50));
                btn.textContent = 'Saved ✓';
                btn.onclick = null;
            };
            ui.actions.appendChild(btn);
            if (nearBottom()) scrollToBottom();
        }

        function showSaved() {
            hideWelcome();
            const chat = document.getElementById('chat');
            const list = getSaved();
            const card = document.createElement('div');
            card.className = 'glass-dock rounded-2xl p-4 msg-in space-y-3';
            const title = document.createElement('div');
            title.className = 'text-brandOrange font-semibold text-sm';
            title.textContent = '⭐ Saved';
            card.appendChild(title);

            if (!list.length) {
                const empty = document.createElement('div');
                empty.className = 'text-sm text-gray-400';
                empty.textContent = 'Nothing saved yet. Tap "⭐ Save" under any answer.';
                card.appendChild(empty);
            } else {
                list.forEach((item, i) => {
                    const box = document.createElement('div');
                    box.className = 'border-t border-white/10 pt-3 text-sm text-gray-200 leading-relaxed';
                    const body = document.createElement('div');
                    body.className = 'reply-text';
                    renderStatic(body, item);
                    const rm = document.createElement('button');
                    rm.className = 'mt-1 text-xs text-gray-500 hover:text-red-400';
                    rm.textContent = 'Remove';
                    rm.onclick = () => {
                        const cur = getSaved();
                        cur.splice(i, 1);
                        setSaved(cur);
                        box.remove();
                    };
                    box.appendChild(body);
                    box.appendChild(rm);
                    card.appendChild(box);
                });
            }
            chat.appendChild(card);
            scrollToBottom();
        }

        /* ---------- Talking to Gemini ---------- */
        async function fetchWithTimeout(url, options, ms) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ms);
            try {
                return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
            } finally {
                clearTimeout(timer);
            }
        }

        // Ask Google which models this key can actually use
        async function discoverModels(apiKey) {
            if (discoveredModels) return discoveredModels;
            try {
                const res = await fetchWithTimeout(`${API_BASE}/models?pageSize=100`, {
                    headers: { 'x-goog-api-key': apiKey }
                }, 12000);
                const data = await res.json();
                if (data.models) {
                    const usable = data.models
                        .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
                        .map(m => m.name.replace('models/', ''))
                        .filter(n => /gemini/.test(n) && !/(image|tts|live|audio|embedding|vision|robotics|computer-use|thinking-exp)/.test(n));
                    const rank = n => /flash-lite/.test(n) ? 1 : /flash/.test(n) ? 0 : 2;
                    usable.sort((a, b) => rank(a) - rank(b));
                    if (usable.length) {
                        discoveredModels = usable;
                        return usable;
                    }
                }
            } catch (e) { /* fall back below */ }
            discoveredModels = FALLBACK_MODELS;
            return discoveredModels;
        }

        // Streams the reply so words appear as soon as the model starts writing
        async function streamModel(model, apiKey, contents, cfgIndex, onText) {
            const res = await fetchWithTimeout(`${API_BASE}/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': apiKey
                },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: SYSTEM_PERSONA }] },
                    contents: contents,
                    generationConfig: Object.assign({ maxOutputTokens: 800 }, THINK_CONFIGS[cfgIndex])
                })
            }, 20000);

            if (!res.ok) {
                let body = null;
                try { body = await res.json(); } catch (e) {}
                const first = Array.isArray(body) ? body[0] : body;
                return { error: (first && first.error) || { code: res.status, message: 'HTTP ' + res.status } };
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let full = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) {
                    if (!line.startsWith('data:')) continue;
                    const json = line.slice(5).trim();
                    if (!json) continue;
                    try {
                        const obj = JSON.parse(json);
                        const parts = obj.candidates && obj.candidates[0] && obj.candidates[0].content && obj.candidates[0].content.parts;
                        if (parts) {
                            full += parts.map(p => p.thought ? '' : (p.text || '')).join('');
                            onText(full);
                        }
                    } catch (e) { /* ignore partial chunk */ }
                }
            }
            return { text: full };
        }

        async function generate(userText, ui, typer, isRetry) {
            const apiKey = getApiKey();

            if (!apiKey) {
                setStatus(ui, `
                    <p class="text-yellow-400 mb-2">Key is missing.</p>
                    <p class="text-gray-300 mb-3">Click the gear icon (⚙️) at the top right and paste your Gemini API key.</p>
                    <button onclick="toggleSettings()" class="bg-brandOrange text-white px-4 py-2 rounded-xl text-xs font-semibold">Open Settings</button>`);
                return false;
            }

            setStatus(ui, '<span class="text-gray-500 animate-pulse">One moment...</span>');

            const contents = chatHistory.slice(-12).concat([{ role: 'user', parts: [{ text: userText }] }]);
            let lastError = 'No model responded.';
            let retryAfter = 0;
            let finalText = '';

            // Try a list of models in order. Returns 'done', 'auth' or 'fail'.
            async function attempt(models) {
                for (const model of models) {
                    const saved = parseInt(localStorage.getItem('subscrap_think_cfg:' + model) || '0', 10);
                    for (let c = saved; c < THINK_CONFIGS.length; c++) {
                        try {
                            typer.reset();
                            const r = await streamModel(model, apiKey, contents, c, text => {
                                if (ui.status.innerHTML) setStatus(ui, '');
                                finalText = text;
                                typer.set(text);
                            });
                            if (r.error) {
                                const msg = r.error.message || '';
                                // This thinking setting is not supported by the model: try the next setting
                                if (r.error.code === 400 && /think|budget|level|generation/i.test(msg) && c < THINK_CONFIGS.length - 1) continue;
                                lastError = msg;
                                const wait = /retry in ([\d.]+)s/i.exec(msg);
                                if (wait) retryAfter = Math.max(retryAfter, Math.ceil(parseFloat(wait[1])));
                                else if (r.error.code === 429) retryAfter = Math.max(retryAfter, 20);
                                if (r.error.code === 401 || r.error.code === 403 || /api key not valid/i.test(msg)) return 'auth';
                                break; // try the next model
                            }
                            if (r.text && r.text.trim()) {
                                localStorage.setItem('subscrap_working_model', model);
                                localStorage.setItem('subscrap_think_cfg:' + model, String(c));
                                return 'done';
                            }
                            lastError = 'Empty response from ' + model;
                            break;
                        } catch (e) {
                            lastError = e.name === 'AbortError' ? model + ' took too long' : e.message;
                            break;
                        }
                    }
                }
                return 'fail';
            }

            // Fast path: the model that worked last time (no model lookup needed)
            const known = [...new Set([localStorage.getItem('subscrap_gemini_model'), localStorage.getItem('subscrap_working_model')].filter(Boolean))];
            let status = known.length ? await attempt(known) : 'fail';

            // Slow path (first time only, or if the known model stopped working)
            if (status === 'fail' && retryAfter === 0) {
                const found = (await discoverModels(apiKey)).filter(m => !known.includes(m)).slice(0, 6);
                status = await attempt(found);
            }

            if (status === 'done') {
                chatHistory.push({ role: 'user', parts: [{ text: userText }] });
                chatHistory.push({ role: 'model', parts: [{ text: finalText }] });
                typer.finish(() => addSaveButton(ui, finalText));
                return true;
            }

            // Free tier limit: wait the time Google asks for, then try once more
            if (retryAfter && !isRetry && status !== 'auth') {
                typer.reset();
                for (let s = retryAfter + 1; s > 0; s--) {
                    setStatus(ui, `<span class="text-gray-500">Free limit reached. Trying again in ${s}s...</span>`);
                    await new Promise(r => setTimeout(r, 1000));
                }
                return generate(userText, ui, typer, true);
            }

            typer.reset();
            setStatus(ui, `<p class="text-red-400">${escapeHtml(lastError)}</p>
                <p class="text-xs text-gray-500 mt-2">Please be cool, Boss gonna kill me if they find this out! 🍲</p>`);
            return false;
        }

        async function sendMessage(text) {
            if (busy || !text) return;
            busy = true;
            hideWelcome();
            addUserMessage(text);
            const ui = addBotMessage();
            const typer = createTyper(ui.text);
            try {
                await generate(text, ui, typer, false);
            } catch (e) {
                setStatus(ui, `<p class="text-red-400">${escapeHtml(e.message)}</p>`);
            } finally {
                busy = false;
            }
        }

        /* ---------- Buttons ---------- */
        function executeSearch() {
            const input = document.getElementById('search-input');
            const text = input.value.trim();
            if (!text || busy) return;
            input.value = '';
            sendMessage(text);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') executeSearch();
        }

        function openBossHelp() {
            sendMessage('I need some help. In one short line, ask me what I need.');
        }
    </script>
</body>
</html>
